# `pre-commit install` installs both hook types, see default_install_hook_types.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Public repository, so a leaked token would be exposed for good.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files

  # Local hooks use the versions pinned in pnpm-lock.yaml, so they match `pnpm lint`.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types: [text]
        exclude: ^pnpm-lock\.yaml$

      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        files: \.(js|ts|svelte)$

      # At push rather than at commit, because it checks the whole project and gets slower
      # as the code grows.
      - id: svelte-check
        name: svelte-check
        entry: pnpm check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
