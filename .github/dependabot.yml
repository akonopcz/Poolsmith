version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same 3 day release age as minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 3
    # One pull request for all action updates instead of one per action.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
